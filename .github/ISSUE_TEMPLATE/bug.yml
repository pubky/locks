name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, sessions, recovery material, bearer tokens, private content, payment requests, addresses, or connection strings. Report vulnerabilities through SECURITY.md.
  - type: input
    id: revision
    attributes:
      label: Commit or version
      placeholder: Full commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use disposable identities and redact all sensitive values.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Relevant logs or test output
      description: Redact sensitive values before submitting.
